# Server block for the static Sparklis files (same behaviour as the upstream docker/nginx.conf)
server {
    listen       8080;
    listen  [::]:8080;      # 'localhost' resolves to ::1 first, the healthcheck needs it
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    absolute_redirect off;
    port_in_redirect  off;

    gzip            on;
    gzip_comp_level 2;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript text/xml application/xml+rss;

    location / {
        try_files $uri $uri/index.html =404;
    }
}
